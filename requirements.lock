# requirements.lock — a fully pinned, known-good dependency set.
#
# Generated with `pip freeze` from a clean virtualenv built from
# requirements.txt, then verified to install and import. Use it when you want
# the exact set that was tested rather than whatever the resolver picks today:
#
#     pip install -r requirements.lock
#
# bootstrap_install.sh prefers this file automatically when it is present.
# Set LLM_NO_LOCK=1 to make it use requirements.txt instead (for example to
# pick up a newer patch release).
#
# CAVEAT, and it is the reason this file is not simply "the" requirements:
# `pip freeze` records one resolution on one platform and drops environment
# markers. This set was resolved on macOS/arm64 with CPython 3.14, so the
# Linux-only GPU package is re-added below WITH its marker — without that,
# installing from this lock on Linux would silently lose GPU detection.
# Regenerate after changing requirements.txt:
#
#     python3 -m venv /tmp/lockenv
#     /tmp/lockenv/bin/pip install -r requirements.txt
#     /tmp/lockenv/bin/pip freeze > requirements.lock   # then re-add this header
#
