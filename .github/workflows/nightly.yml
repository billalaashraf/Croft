name: Nightly

# The slow, network-heavy checks. These are the ones that catch the failures
# users actually hit on a fresh machine, and they are too expensive to run on
# every pull request:
#
#   * engines   — installs the real torch/diffusers stack (gigabytes of wheels)
#   * checksums — verifies the manifest's hashes against the live files
#   * upstream  — notices when a pinned model revision no longer exists
#
# A failure here is not a broken commit; it usually means the world moved. Read
# it as a notification, not a regression.

on:
  schedule:
    - cron: "17 4 * * *"        # 04:17 UTC daily, off the hour to dodge the rush
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    name: engines install and import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This is the job whose absence let a real bug reach a working machine:
      # the per-PR smoke test sets LLM_NO_ENGINES=1, so nothing ever installed
      # the engines and nothing ever imported them. `transformers` 5.x silently
      # violated the huggingface_hub<1.0 pin and left the image stack broken on
      # an install that reported success.
      - name: Install core + the CPU engine stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch diffusers 'transformers>=4.46,<5' accelerate \
                      safetensors pillow imageio imageio-ffmpeg

      - name: Nothing in the resolved set conflicts
        run: pip check

      - name: The engines actually import
        run: |
          python - <<'PY'
          import huggingface_hub, torch, diffusers, transformers
          print("huggingface_hub", huggingface_hub.__version__)
          print("transformers   ", transformers.__version__)
          print("diffusers      ", diffusers.__version__)
          print("torch          ", torch.__version__)

          # The specific breakage this job exists to catch: transformers 5.x
          # needs huggingface_hub>=1.5, requirements.txt pins <1.0, and the
          # loser is transformers — which fails at import, not at install.
          major = int(huggingface_hub.__version__.split(".")[0])
          assert major == 0, f"huggingface_hub {huggingface_hub.__version__} breaks the <1.0 pin"
          assert transformers.__version__.startswith("4."), \
              f"transformers {transformers.__version__} requires hub >=1.5"
          PY

      - name: The web app imports with the engines present
        run: |
          pip install fastapi 'uvicorn[standard]' httpx pytest python-multipart
          python -c "from webui import app; print('webui ok')"
          pytest -q

  checksums:
    name: manifest checksums match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit tests assert the shipped hash is a well-formed SHA256 and that
      # every direct-URL entry has one. Neither says the value is *correct* — a
      # wrong digest fails verification for every new user while the suite stays
      # green. This downloads the real files and settles it.
      - name: Download each direct-URL model and verify its hash
        run: |
          python - <<'PY'
          import hashlib, json, sys, urllib.request

          failures = []
          for e in json.load(open("models_manifest.json"))["models"]:
              url, want = e.get("download_url"), e.get("integrity_sha256")
              if not url:
                  continue
              print(f"→ {e['id']}: {url}", flush=True)
              h = hashlib.sha256()
              with urllib.request.urlopen(url, timeout=600) as r:
                  while chunk := r.read(1 << 20):
                      h.update(chunk)
              got = h.hexdigest()
              if got != want:
                  failures.append(f"{e['id']}: manifest {want}, upstream {got}")
                  print(f"  MISMATCH {got}")
              else:
                  print("  ok")

          if failures:
              print("\nThe manifest no longer matches upstream:")
              print("\n".join("  " + f for f in failures))
              sys.exit(1)
          PY

  revisions:
    name: pinned revisions still exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the core requirements
        # Needed only to import installer.recommend, so the built-in catalog's
        # pins are checked alongside the manifest's. Five model ids exist only
        # in DEFAULT_REVISIONS and would otherwise go unverified.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A pin is only useful while it resolves. A repo that is deleted, renamed
      # or made private turns every install of that model into a 404, and there
      # is no way to notice from inside the codebase.
      #
      # Gated repos need credentials. Without them Hugging Face answers 401/403
      # for *any* revision of a gated repo — existing or not — so treating that
      # as success would let a bad pin sit here looking verified. Set an
      # HF_TOKEN repository secret (read scope, with the model licences
      # accepted on the account) to check those too; anything unverifiable is
      # reported as such and fails the job rather than passing quietly.
      - name: Every pinned commit resolves on Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          sys.path.insert(0, ".")
          from installer import recommend as rec

          token = (os.environ.get("HF_TOKEN") or "").strip()
          print(f"HF token: {'present' if token else 'ABSENT — gated repos cannot be checked'}\n")

          # Every pin from both sources, deduplicated. The manifest wins where
          # the two overlap; a disagreement is caught by the unit tests.
          pins = {}
          for m in rec.DEFAULT_CATALOG:
              if not m.download_url and m.revision:
                  pins[m.id] = (m.hf_repo, m.revision)
          for e in json.load(open("models_manifest.json"))["models"]:
              if e.get("hf_repo") and not e.get("download_url") and e.get("revision"):
                  pins[e["id"]] = (e["hf_repo"], e["revision"])

          gone, unverified = [], []
          for mid, (repo, rev) in sorted(pins.items()):
              req = urllib.request.Request(
                  f"https://huggingface.co/api/models/{repo}/revision/{rev}")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      json.load(r)
                  print(f"ok         {mid:24} {repo}@{rev[:12]}")
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      gone.append(f"{mid}: {repo}@{rev} → 404, that commit is gone")
                      print(f"GONE       {mid:24} {repo}@{rev[:12]} → 404")
                  elif exc.code in (401, 403):
                      # Says nothing about the revision — only that we cannot
                      # look. Never count this as a pass.
                      why = ("token lacks access, or its account has not "
                             "accepted the licence") if token else \
                            "no HF_TOKEN secret configured"
                      unverified.append(
                          f"{mid}: {repo}@{rev} → HTTP {exc.code} ({why})")
                      print(f"UNVERIFIED {mid:24} {repo}@{rev[:12]} → HTTP {exc.code}")
                  else:
                      unverified.append(f"{mid}: {repo}@{rev} → HTTP {exc.code}")
                      print(f"UNVERIFIED {mid:24} {repo}@{rev[:12]} → HTTP {exc.code}")
              except Exception as exc:
                  unverified.append(f"{mid}: {repo}@{rev} → {exc}")
                  print(f"UNVERIFIED {mid:24} {exc}")

          print(f"\n{len(pins)} pins checked: {len(pins) - len(gone) - len(unverified)} ok, "
                f"{len(gone)} gone, {len(unverified)} unverified")

          if gone:
              print("\nPinned commits that no longer exist — repoint these:")
              print("\n".join("  " + f for f in gone))
          if unverified:
              print("\nPins that could NOT be verified (not the same as valid):")
              print("\n".join("  " + f for f in unverified))
              print("\n  These are gated repos. Add a read-scoped HF_TOKEN")
              print("  repository secret from an account that has accepted their")
              print("  licences, so this job can check them.")
          if gone or unverified:
              sys.exit(1)
          PY
